<template>
  <div id="root" data-composition-id="09-stats" data-width="1920" data-height="1080" data-duration="5">
    <style>
      @font-face { font-family: "Noto Sans JP"; src: url("assets/fonts/NotoSansJP-VF.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: block; }
      @font-face { font-family: "Barlow"; src: url("assets/fonts/Barlow-BlackItalic.ttf") format("truetype"); font-weight: 900; font-style: italic; font-display: block; }
      @font-face { font-family: "Barlow"; src: url("assets/fonts/Barlow-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: block; }

#root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        container-type: size;
      }

      /* Navy wash: footage stays ~45% visible; a touch heavier across the card band */
      .p09-stats-wash {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(11, 26, 42, 0.7) 0%,
          rgba(11, 26, 42, 0.6) 55%,
          rgba(11, 26, 42, 0.45) 100%
        );
        pointer-events: none;
      }

      .p09-stats-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .p09-stats-kicker {
        position: absolute;
        left: 5.5cqw;
        top: 5.5cqw;
        display: flex;
        align-items: center;
        gap: 1cqw;
      }

      .p09-stats-rule {
        width: 36px;
        height: 2px;
        background: #ffd83d;
      }

      .p09-stats-kicker-text {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 1.1cqw;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #ffd83d;
        white-space: pre;
        min-width: 22cqw;
      }

      /* Triptych: three top-border-only stat cards across the upper band */
      .p09-stats-row {
        position: absolute;
        left: 5.5cqw;
        right: 5.5cqw;
        top: 270px;
        display: flex;
        gap: 2.5cqw;
      }

      .p09-stats-card {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        padding-top: 2cqw;
        height: 380px;
      }

      .p09-stats-line {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 4px;
        overflow: visible;
      }

      .p09-stats-line line {
        fill: none;
      }

      .p09-stats-line .p09-stats-hair {
        stroke: rgba(255, 255, 255, 0.45);
        stroke-width: 1;
      }

      .p09-stats-line .p09-stats-accent {
        stroke: #ffd83d;
        stroke-width: 3;
      }

      .p09-stats-note {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 0.9cqw;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
        margin-bottom: 1.6cqw;
      }

      .p09-stats-figure {
        display: flex;
        align-items: baseline;
        gap: 0.6cqw;
        height: 7cqw;
        white-space: nowrap;
      }

      .p09-stats-num-wrap {
        display: flex;
        align-items: baseline;
      }

      .p09-stats-num {
        display: inline-block;
        font-family: "Noto Sans JP", sans-serif;
        font-weight: 900;
        font-size: 6.2cqw;
        line-height: 1;
        letter-spacing: -0.04em;
        color: #ffd83d;
        font-variant-numeric: tabular-nums;
        transform-origin: left bottom;
      }

      .p09-stats-unit {
        display: inline-block;
        font-family: "Noto Sans JP", sans-serif;
        font-weight: 900;
        font-size: 6.2cqw;
        line-height: 1;
        letter-spacing: -0.04em;
        color: #ffd83d;
      }

      .p09-stats-unit-sm {
        font-size: 3.4cqw;
        letter-spacing: -0.02em;
        margin-left: 0.2cqw;
      }

      .p09-stats-side {
        display: inline-block;
        font-family: "Noto Sans JP", sans-serif;
        font-weight: 700;
        font-size: 2.6cqw;
        line-height: 1;
        color: #ffffff;
        margin-left: 0.6cqw;
      }

      .p09-stats-pre {
        display: inline-block;
        font-family: "Noto Sans JP", sans-serif;
        font-weight: 700;
        font-size: 1.8cqw;
        line-height: 1;
        color: #ffffff;
        margin-right: 0.4cqw;
      }

      .p09-stats-body {
        margin-top: 1.8cqw;
        min-height: 6cqw;
        font-family: "Noto Sans JP", sans-serif;
        font-weight: 700;
        font-size: 2cqw;
        line-height: 1.35;
        color: #ffffff;
      }
    </style>

    <!-- Approved full-bleed footage (hoisted to host by the assembler); 4s clip, last frame holds to 4.5s -->
    <!-- approved frame video hoisted by assemble-index -->

    <div id="p09-stats-wash" class="clip p09-stats-wash" data-start="0" data-duration="5" data-track-index="1"></div>

    <div id="p09-stats-layer" class="clip p09-stats-layer" data-start="0" data-duration="5" data-track-index="2">
      <div id="p09-stats-kicker" class="p09-stats-kicker">
        <div id="p09-stats-rule" class="p09-stats-rule"></div>
        <div id="p09-stats-kicker-text" class="p09-stats-kicker-text"></div>
      </div>

      <div id="p09-stats-row" class="p09-stats-row">
        <!-- Card 1 -->
        <div id="p09-stats-card1" class="p09-stats-card">
          <svg class="p09-stats-line" viewBox="0 0 540 4" preserveAspectRatio="none">
            <line id="p09-stats-hair1" class="p09-stats-hair" x1="0" y1="1" x2="540" y2="1" />
            <line id="p09-stats-acc1" class="p09-stats-accent" x1="0" y1="1.5" x2="540" y2="1.5" />
          </svg>
          <div class="p09-stats-note">01 / COURSE</div>
          <div class="p09-stats-figure">
            <span class="p09-stats-num-wrap">
              <span id="p09-stats-num1" class="p09-stats-num">0.0</span><span id="p09-stats-unit1" class="p09-stats-unit">km</span>
            </span>
            <span id="p09-stats-side1" class="p09-stats-side">× 2周</span>
          </div>
          <div id="p09-stats-body1" class="p09-stats-body">実在の道路で 1 周</div>
        </div>

        <!-- Card 2 -->
        <div id="p09-stats-card2" class="p09-stats-card">
          <svg class="p09-stats-line" viewBox="0 0 540 4" preserveAspectRatio="none">
            <line id="p09-stats-hair2" class="p09-stats-hair" x1="0" y1="1" x2="540" y2="1" />
            <line id="p09-stats-acc2" class="p09-stats-accent" x1="0" y1="1.5" x2="540" y2="1.5" />
          </svg>
          <div class="p09-stats-note">02 / ONLINE</div>
          <div class="p09-stats-figure">
            <span class="p09-stats-num-wrap">
              <span id="p09-stats-pre2" class="p09-stats-pre">最大</span><span id="p09-stats-num2" class="p09-stats-num">1</span><span id="p09-stats-unit2" class="p09-stats-unit p09-stats-unit-sm">人</span>
            </span>
          </div>
          <div id="p09-stats-body2" class="p09-stats-body">オンライン対戦</div>
        </div>

        <!-- Card 3 -->
        <div id="p09-stats-card3" class="p09-stats-card">
          <svg class="p09-stats-line" viewBox="0 0 540 4" preserveAspectRatio="none">
            <line id="p09-stats-hair3" class="p09-stats-hair" x1="0" y1="1" x2="540" y2="1" />
            <line id="p09-stats-acc3" class="p09-stats-accent" x1="0" y1="1.5" x2="540" y2="1.5" />
          </svg>
          <div class="p09-stats-note">03 / PRICE</div>
          <div class="p09-stats-figure">
            <span class="p09-stats-num-wrap">
              <span id="p09-stats-num3" class="p09-stats-num">0</span><span id="p09-stats-unit3" class="p09-stats-unit p09-stats-unit-sm">円</span>
            </span>
          </div>
          <div id="p09-stats-body3" class="p09-stats-body">インストール不要・<br />ブラウザで遊べる</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // 120 BPM grid: 1 beat = 0.5s
        const B = 0.5;
        const LINE_LEN = 540; // svg line length in viewBox units (measured == x2 - x1)
        const START_SCALE = 0.55; // counting-dynamic-scale: start ≈ 55% of end size
        const RISE = 60;

        // Dash setup for every hairline / accent line (svg-path-draw)
        document.querySelectorAll("#p09-stats-row line").forEach(function (l) {
          const len = typeof l.getTotalLength === "function" ? l.getTotalLength() || LINE_LEN : LINE_LEN;
          l.style.strokeDasharray = String(len);
          l.style.strokeDashoffset = String(len);
        });

        // ---- Scene 1 (0.0–0.5s): footage dims under the wash; kicker types in ----
        tl.fromTo("#p09-stats-wash", { opacity: 0.35 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0);
        tl.fromTo("#p09-stats-rule", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 0);

        const KICKER = "MATSUE GRAND PRIX";
        const kickerEl = document.getElementById("p09-stats-kicker-text");
        const typeState = { n: 0 };
        let lastN = -1;
        tl.fromTo(
          typeState,
          { n: 0 },
          {
            n: KICKER.length,
            duration: 0.42,
            ease: "none",
            onUpdate: function () {
              const n = Math.round(typeState.n);
              if (n !== lastN) {
                kickerEl.textContent = KICKER.slice(0, n);
                lastN = n;
              }
            },
          },
          0.05
        );

        // Card entrance helper: rise into slot + grey top hairline draws
        function cardIn(i, at) {
          tl.fromTo(
            "#p09-stats-card" + i,
            { opacity: 0, y: RISE },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            at
          );
          tl.to("#p09-stats-hair" + i, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, at);
        }

        // ---- Scene 2 (0.5–1.5s): card 1 — 9.6km counts up, × 2周, body ----
        const C1 = B * 1; // 0.5
        const COUNT1 = 0.85;
        cardIn(1, C1);
        const num1 = document.getElementById("p09-stats-num1");
        const s1 = { v: 0 };
        let last1 = "";
        tl.fromTo(
          s1,
          { v: 0 },
          {
            v: 9.6,
            duration: COUNT1,
            ease: "power3.out",
            onUpdate: function () {
              const txt = (Math.round(s1.v * 10) / 10).toFixed(1);
              if (txt !== last1) {
                num1.textContent = txt;
                last1 = txt;
              }
            },
          },
          C1
        );
        tl.fromTo(num1, { scale: START_SCALE }, { scale: 1, duration: COUNT1, ease: "power3.out" }, C1);
        tl.fromTo("#p09-stats-unit1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, C1 + COUNT1 - 0.1);
        tl.fromTo("#p09-stats-side1", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, C1 + COUNT1);
        tl.fromTo("#p09-stats-body1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, C1 + 0.25);

        // ---- Scene 3 (1.5–2.5s): beat 4 — card 2 — 最大 8人 counts 1 → 8 ----
        const C2 = B * 3; // 1.5
        const COUNT2 = 0.8;
        cardIn(2, C2);
        const num2 = document.getElementById("p09-stats-num2");
        const s2 = { v: 1 };
        let last2 = "";
        tl.fromTo(
          s2,
          { v: 1 },
          {
            v: 8,
            duration: COUNT2,
            ease: "power3.out",
            onUpdate: function () {
              const txt = String(Math.round(s2.v));
              if (txt !== last2) {
                num2.textContent = txt;
                last2 = txt;
              }
            },
          },
          C2
        );
        tl.fromTo(num2, { scale: START_SCALE }, { scale: 1, duration: COUNT2, ease: "power3.out" }, C2);
        tl.fromTo("#p09-stats-pre2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, C2 + 0.1);
        tl.fromTo("#p09-stats-unit2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, C2 + COUNT2);
        tl.fromTo("#p09-stats-body2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, C2 + 0.25);

        // ---- Scene 4 (2.5–3.5s): beat 6 — card 3 — 0円 ----
        const C3 = B * 5; // 2.5
        cardIn(3, C3);
        tl.fromTo("#p09-stats-num3", { scale: START_SCALE }, { scale: 1, duration: 0.6, ease: "power3.out" }, C3);
        tl.fromTo("#p09-stats-unit3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, C3 + 0.4);
        tl.fromTo("#p09-stats-body3", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, C3 + 0.25);

        // ---- Scene 5 (3.5–4.5s): yellow top hairlines draw across the triptych, then still ----
        const C5 = B * 7; // 3.5
        const DRAW = 0.4;
        tl.to("#p09-stats-acc1", { strokeDashoffset: 0, duration: DRAW, ease: "power2.out" }, C5);
        tl.to("#p09-stats-acc2", { strokeDashoffset: 0, duration: DRAW, ease: "power2.out" }, C5 + DRAW * 0.75);
        tl.to("#p09-stats-acc3", { strokeDashoffset: 0, duration: DRAW, ease: "power2.out" }, C5 + DRAW * 1.5);

        // Hold to the full 4.5s (no exit — the root transition owns it)
        tl.to({}, { duration: 0.1 }, 4.4);

        window.__timelines["09-stats"] = tl;
      })();
    </script>
  </div>
</template>
