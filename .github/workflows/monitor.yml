name: Monitor production

# 本番の外形監視と、利用者のブラウザで起きたエラーの通知。3 時間おきに:
#   1. 配信物が揃っているか・TURN の設定 API が応えるか・ランキングの一覧が読めるか・対戦の
#      シグナリングに使う nostr リレーにつながるかを見る (tools/check_site.mjs)。失敗すると Issue「本番の外形監視が失敗しています」を
#      作り (開いていればコメントを足し)、通るようになったら「復旧」とコメントして閉じる。
#      ジョブ自体も失敗にするので、Actions の失敗通知も別に届く
#   2. ページの src/telemetry.ts が Worker (workers/turn/) に送った例外・読み込み失敗をまとめ、
#      Issue「利用者のブラウザでエラーが起きています」に足す (tools/telemetry_report.mjs)。
#      これは直したら手で閉じる。まとめた記録は Worker 側で通知済みにするので、次回は新しい分だけ
# Issue は持ち主を担当者にして @メンションするので、リポジトリを Watch していなくてもメールで届く
# (tools/alert_issue.mjs)。要るもの: リポジトリ変数 TELEMETRY_URL、secret TELEMETRY_TOKEN。
# リポジトリに 60 日動きが無いと GitHub は定期実行を止めるので、最後に自分を有効化し直して時計を戻す。
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write    # 通知の Issue
  actions: write   # 定期実行の有効化し直し

concurrency:
  group: monitor
  cancel-in-progress: false

env:
  SITE_URL: https://matsue.citykart.jp/
  SITE: matsue
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    runs-on: ubuntu-latest
    # 止まったまま concurrency: monitor を握り続けて、後の実行を待たせないように
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Check production
        id: site
        # 失敗しても先へ進み (通知してから)、最後のステップでジョブを失敗にする。
        # shell: bash を明示すると pipefail が付き、tee を挟んでも node の失敗が伝わる
        continue-on-error: true
        # 本番が応答しないまま待ち続けても、ここで打ち切って失敗として通知へ進む
        timeout-minutes: 15
        shell: bash
        run: node tools/check_site.mjs "$SITE_URL" --relays --ranking "$RANKING_URL" 2>&1 | tee site.log
        env:
          # ランキングの一覧が読めるかも見る (登録はしない)。変数が無ければ見ない
          RANKING_URL: ${{ vars.RANKING_URL }}

      - name: Collect browser errors
        id: telemetry
        # Worker が落ちていると、ここも外形監視と一緒に失敗する。そのときも下の
        # 「Report site failure」まで進めるよう、失敗しても先へ進む (最後にジョブを失敗にする)
        continue-on-error: true
        timeout-minutes: 3
        run: node tools/telemetry_report.mjs --site "$SITE" --out telemetry.md
        env:
          TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_TOKEN }}

      # if に always() を付けないと、暗黙に success() && が付き、前のどれかが失敗しただけで飛ばされる
      - name: Report site failure
        if: always() && steps.site.outcome == 'failure'
        run: node tools/alert_issue.mjs open --title "本番の外形監視が失敗しています" --text "$SITE_URL の点検が失敗しました。直るまで 3 時間おきにここへ足します。" --log site.log --run "$RUN_URL"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Close site issue on recovery
        if: always() && steps.site.outcome == 'success'
        run: node tools/alert_issue.mjs close --title "本番の外形監視が失敗しています" --text "点検が通るようになりました。" --run "$RUN_URL"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report browser errors
        id: report_errors
        if: always() && steps.telemetry.outcome == 'success' && steps.telemetry.outputs.count != '0'
        run: node tools/alert_issue.mjs open --title "利用者のブラウザでエラーが起きています" --body-file telemetry.md --run "$RUN_URL"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Mark browser records as notified
        # Issue に足せなかったときは通知済みにしない (次の回にもう一度足す)
        if: always() && steps.telemetry.outcome == 'success' && steps.report_errors.outcome != 'failure'
        run: node tools/telemetry_report.mjs --site "$SITE" --ack "$LAST"
        env:
          # 前のステップの出力は env で渡す (run に直接埋め込むと、中身がシェルのコマンドとして読まれる)
          LAST: ${{ steps.telemetry.outputs.last }}
          TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_TOKEN }}

      - name: Keep the schedule alive
        if: always()
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail when a check failed
        if: always() && (steps.site.outcome == 'failure' || steps.telemetry.outcome == 'failure')
        run: exit 1
